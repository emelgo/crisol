# Listón de calidad de CONSTRAINTS.md. Lo que «avisa» pasa a bloquear solo el 2026-11-12 (scripts/avisa-hasta.ts).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AVISA_HASTA: "2026-11-12"

jobs:
  calidad:
    name: Lint, tipos, pruebas, licencias y límites
    runs-on: ubuntu-24.04
    # Un tope por si algo se cuelga, no un listón: con el módulo 6 tarda ~15 min
    timeout-minutes: 25
    # Postgres y Valkey para las pruebas de integración (cada paquete crea su base desde cero)
    services:
      postgres:
        # Con pgvector (docs/specs/biblioteca.md); el texto, ordenado por bytes como en el Postgres de Alpine
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: crisol
          POSTGRES_PASSWORD: crisol
          POSTGRES_DB: crisol
          POSTGRES_INITDB_ARGS: --locale=C.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crisol" --health-interval 2s --health-timeout 3s --health-retries 30
      valkey:
        image: valkey/valkey:9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://crisol:crisol@localhost:5432/crisol
      TEST_VALKEY_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
        with:
          # La cobertura de lo cambiado compara con la rama base
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint y formato
        run: pnpm lint
      - name: Tipos
        run: pnpm typecheck
      - name: Pruebas con cobertura
        run: pnpm test:coverage
      # Sola y sin cobertura: con todo a la vez se mediría la carga (ADR-0017, p95 < 300 ms con 5.000 páginas)
      - name: Rendimiento de lo que lee un jugador
        run: pnpm --filter @crisol/server test:rendimiento
      - name: Licencias
        run: pnpm licencias
      - name: Sala limpia
        run: pnpm sala-limpia
      - name: Cobertura de lo cambiado (≥ 80 %)
        if: github.event_name == 'pull_request'
        # La rama base, por una variable: nada de GitHub va directo a la orden
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/avisa-hasta.ts "$AVISA_HASTA" node scripts/cobertura-diff.ts "origin/$BASE_REF"
      - name: Límites entre módulos
        run: node scripts/avisa-hasta.ts "$AVISA_HASTA" pnpm limites

  e2e:
    name: Extremo a extremo y accesibilidad
    runs-on: ubuntu-24.04
    # Un tope por si algo se cuelga, no un listón: con libros y el espacio de la campaña pasa de 30 min
    timeout-minutes: 50
    services:
      postgres:
        # Con pgvector (docs/specs/biblioteca.md); el texto, ordenado por bytes como en el Postgres de Alpine
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: crisol
          POSTGRES_PASSWORD: crisol
          POSTGRES_DB: crisol
          POSTGRES_INITDB_ARGS: --locale=C.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crisol" --health-interval 2s --health-timeout 3s --health-retries 30
      valkey:
        image: valkey/valkey:9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://crisol:crisol@localhost:5432/crisol
      TEST_VALKEY_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Navegador de Playwright
        run: pnpm --filter @crisol/e2e exec playwright install --with-deps chromium
      - name: Web compilada
        run: pnpm --filter @crisol/web build
      - name: Extremo a extremo
        run: pnpm --filter @crisol/e2e e2e
      # CONSTRAINTS.md: un jugador no recibe nada que no pueda ver (API, WebSocket, MCP). Bloquea
      - name: Prueba de fugas
        run: pnpm --filter @crisol/e2e e2e:fugas
      - name: Accesibilidad (WCAG 2.1 AA con axe)
        run: node scripts/avisa-hasta.ts "$AVISA_HASTA" pnpm --filter @crisol/e2e e2e:a11y
      - name: Trazas de las pruebas que fallen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: trazas-e2e
          path: e2e/test-results/
          retention-days: 7

  secretos:
    name: Secretos
    runs-on: ubuntu-24.04
    # Si el runner se cuelga (pasó al limpiar procesos), que falle en vez de quedarse pendiente
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (todo el historial)
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --no-banner /repo

  seguridad:
    name: Seguridad del código y de las dependencias
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: semgrep (hallazgos altos)
        run: >
          node scripts/avisa-hasta.ts "$AVISA_HASTA"
          docker run --rm -v "$PWD:/src:ro" -w /src semgrep/semgrep:1.182.0
          semgrep scan --config p/default --severity ERROR --error --metrics off --quiet
      - name: osv-scanner (altas o críticas)
        run: |
          # osv-scanner sale con error ante cualquier vulnerabilidad; el filtro por gravedad lo hace osv-altos.ts
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.7.0 \
            scan source --lockfile /src/pnpm-lock.yaml --format json --output /src/osv.json || true
          node scripts/avisa-hasta.ts "$AVISA_HASTA" node scripts/osv-altos.ts osv.json
