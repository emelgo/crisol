# gitleaks: sus reglas de siempre y, aparte, lo que no es un secreto
[extend]
useDefault = true

# El contenido del 5e sale del SRD (lo escribe scripts/srd/extraer.ts) y su «key» es la clave de un documento, en
# minúsculas y con guiones bajos (cota_de_malla_2014), no una credencial
[[allowlists]]
description = "Las claves de los documentos del contenido"
paths = ['''^packages/systems/src/catalog/5e/content/[a-z_]+\.json$''']

[[allowlists]]
description = "Una clave de documento en el código y sus pruebas (key: 'guerrero_tomar_aliento_2014', c.key === 'bola_de_fuego_2014')"
regexTarget = "match"
regexes = ['''key["']?\s*(?:===?|[:=])\s*["'][a-z0-9]+(?:_[a-z0-9]+)+["']''']

[[allowlists]]
description = "Una clave de documento del 5e en una lista (keys: ['guerrero_goblin_2014']): palabras en minúsculas que acaban en su edición"
regexTarget = "match"
regexes = ['''["'][a-z]+(?:_[a-z]+)*_20(?:14|24)["']''']
