<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- El color de la barra de arriba, que es oscura en los dos temas -->
    <meta name="theme-color" content="#1b1d22" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)" />
    <title>Crisol</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="robots" content="noindex" />
    <meta property="og:title" content="Crisol" />
    <meta property="og:description" content="Mundos de rol y mesa virtual" />
    <script>
      // Aplica el tema antes de pintar para que no parpadee (la lógica completa está en src/theme.ts)
      const t = localStorage.getItem('crisol.tema')
      document.documentElement.dataset.theme =
        t === 'light' || t === 'dark' ? t : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      // Y las animaciones: completas salvo que se elijan reducidas o las del sistema (src/motion.ts)
      const m = localStorage.getItem('crisol.movimiento')
      document.documentElement.dataset.motion =
        m === 'reduced' || (m === 'system' && matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'reduced' : 'full'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
