<!-- La marca de Crisol: la llama (de Lucide, ISC) sobre un cuadrado oscuro redondeado, como el icono del Crisol antiguo -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Crisol</title>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1d20"/>
      <stop offset="1" stop-color="#18191c"/>
    </linearGradient>
    <linearGradient id="llama" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e5484d"/>
      <stop offset="1" stop-color="#ff8a5c"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#fondo)"/>
  <g transform="translate(32 32.75) scale(1.75) translate(-12 -12.5)">
    <path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4" fill="none" stroke="url(#llama)" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
