# Servicios de desarrollo, solo en loopback. Arrancan con `pnpm servicios` (o `pnpm dev`).
name: crisol-dev

services:
  postgres:
    # El de Alpine con pgvector (docker/postgres): la búsqueda por significado
    build: docker/postgres
    image: crisol-postgres:17
    environment:
      POSTGRES_USER: crisol
      POSTGRES_PASSWORD: crisol
      POSTGRES_DB: crisol
    ports:
      - 127.0.0.1:54330:5432
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U crisol]
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:9-alpine
    ports:
      - 127.0.0.1:63790:6379
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30

  # Correo de desarrollo: SMTP en 10250 y bandeja web en http://127.0.0.1:8250
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - 127.0.0.1:10250:1025
      - 127.0.0.1:8250:8025

volumes:
  postgres:
