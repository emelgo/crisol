<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="2000" viewBox="0 0 1500 1000">
<title>La cripta de Varn</title>
<!-- La cripta de Varn: el mapa del lienzo «Crisol: la mesa» (out/lienzo-mesa/project/Cripta.dc.html), sin la niebla ni la rejilla del
     prototipo, a 3000 × 2000 px (casillas de 100 px). Dibujo propio de Crisol -->
<defs>
<filter id="rock" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="5" seed="7"></feTurbulence><feColorMatrix values="0 0 0 0 0.16  0 0 0 0 0.145  0 0 0 0 0.13  0.9 0 0 0 -0.3"></feColorMatrix></filter>
<filter id="worn" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="2" seed="3" result="n"></feTurbulence><feColorMatrix in="n" type="saturate" values="0" result="g"></feColorMatrix><feComponentTransfer in="g" result="g2"><feFuncR type="linear" slope="0.7" intercept="0.5"></feFuncR><feFuncG type="linear" slope="0.7" intercept="0.5"></feFuncG><feFuncB type="linear" slope="0.7" intercept="0.5"></feFuncB></feComponentTransfer><feBlend in="SourceGraphic" in2="g2" mode="multiply" result="b"></feBlend><feComposite in="b" in2="SourceGraphic" operator="in"></feComposite></filter>
<pattern id="flag" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="#2f2924"></rect><rect x="2" y="2" width="46" height="46" rx="3" fill="#6b6056"></rect><rect x="52" y="2" width="46" height="46" rx="3" fill="#5f554b"></rect><rect x="2" y="52" width="46" height="46" rx="3" fill="#585046"></rect><rect x="52" y="52" width="46" height="46" rx="3" fill="#706459"></rect><path d="M14 20l9 6M70 66l12-4M30 80l4 8" stroke="#3f3730" stroke-width="1.5" fill="none"></path></pattern>
<pattern id="crypt" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="#2c2722"></rect><rect x="1.5" y="1.5" width="47" height="47" rx="2" fill="#4f4943"></rect><path d="M8 40l10-6" stroke="#38332e" stroke-width="1.2"></path></pattern>
<radialGradient id="torch"><stop offset="0" stop-color="#ffb04a" stop-opacity="0.55"></stop><stop offset="0.45" stop-color="#ff8a2a" stop-opacity="0.2"></stop><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"></stop></radialGradient>
<radialGradient id="water" cx="0.45" cy="0.4"><stop offset="0" stop-color="#2f5d73"></stop><stop offset="1" stop-color="#132631"></stop></radialGradient>
</defs>
