packages:
  - apps/*
  - packages/*
  - scripts
  - e2e

# Scripts de instalación: ninguno hace falta (los binarios llegan como dependencias opcionales)
allowBuilds:
  "@swc/core": false
  # Trae sus binarios ya compilados (prebuilds): no hace falta compilarlo
  classic-level: false
  esbuild: false
  msgpackr-extract: false
  # Trae su librería ya compilada; su script solo baja la de CUDA, que no se usa
  onnxruntime-node: false

# El lienzo nativo de pdf.js solo sirve en Node: la web no lo usa
ignoredOptionalDependencies:
  - "@napi-rs/canvas"

# Versiones compartidas por todos los paquetes (se usan con "catalog:")
catalog:
  "@biomejs/biome": 2.6.4
  # El modelo de la búsqueda por significado (docs/specs/biblioteca.md): el motor (MIT) y el tokenizador en wasm
  # (Apache-2.0); la librería nativa es para glibc (la imagen de la app va en Debian)
  onnxruntime-node: 1.31.1
  "@sctg/sentencepiece-js": 1.3.3
  # Los dados 3D (docs/specs/dados.md): el dibujo y la física, los dos MIT, cargados aparte en la web
  three: 0.185.1
  "@types/three": 0.185.3
  cannon-es: 0.20.0
  "@axe-core/playwright": ^4.14.0
  "@better-auth/cimd": 1.7.14
  "@better-auth/drizzle-adapter": 1.7.14
  "@better-auth/mcp": 1.7.14
  "@better-auth/oauth-provider": 1.7.14
  "@modelcontextprotocol/client": ^2.4.0
  "@modelcontextprotocol/server": ^2.4.0
  "@playwright/test": ^1.64.1
  # Los iconos de la interfaz (ISC)
  lucide-react: 1.57.0
  # Para sacar el PDF de la hoja en el servidor, con el Chromium del sistema (Apache-2.0)
  playwright-core: ^1.64.1
  "@swc/core": ^1.16.20
  "@tanstack/react-query": ^5.105.0
  "@tanstack/react-router": ^1.170.46
  "@tanstack/react-virtual": ~3.14.19
  "@testing-library/react": ^16.3.3
  "@tiptap/core": 3.32.1
  "@tiptap/extension-collaboration": 3.32.1
  "@tiptap/extension-collaboration-caret": 3.32.1
  "@tiptap/extension-bubble-menu": 3.32.1
  "@tiptap/extension-drag-handle": 3.32.1
  "@tiptap/extension-drag-handle-react": 3.32.1
  "@tiptap/extension-heading": 3.32.1
  "@tiptap/extension-list": 3.32.1
  "@tiptap/extension-node-range": 3.32.1
  "@tiptap/extension-table": 3.32.1
  "@tiptap/extension-unique-id": 3.32.1
  "@tiptap/markdown": 3.32.1
  "@tiptap/pm": 3.32.1
  "@tiptap/react": 3.32.1
  "@tiptap/starter-kit": 3.32.1
  "@tiptap/suggestion": 3.32.1
  "@tiptap/y-tiptap": ^3.0.11
  "@testing-library/user-event": ^14.6.8
  "@types/node": ^24.10.0
  auth: 1.7.14
  better-auth: 1.7.14
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.2
  "@vitest/coverage-v8": ^5.0.5
  dependency-cruiser: ^18.7.0
  drizzle-kit: ^0.31.11
  drizzle-orm: ^0.45.4
  fastify: ^5.12.7
  fflate: ^0.8.3
  happy-dom: ^21.0.4
  # El visor de PDF de la web (Apache-2.0), cargado solo al abrir uno
  pdfjs-dist: ^6.4.299
  # La mesa (ADR-0018): el lienzo del mapa (MIT), cargado solo en la mesa y en la pantalla de la tele
  pixi.js: 8.22.0
  "@floating-ui/dom": ^1.7.4
  "@fastify/rate-limit": ^11.2.1
  "@fontsource/barlow": ^5.3.0
  "@fontsource/barlow-condensed": ^5.3.0
  # La letra del tema Pergamino de la hoja (OFL)
  "@fontsource/alegreya": ^5.3.0
  "@fastify/static": ^10.1.8
  "@fastify/websocket": ^11.3.4
  "@hocuspocus/provider": ^4.8.0
  "@hocuspocus/server": ^4.8.0
  bullmq: 6.3.15
  # Los paquetes LevelDB de Foundry, al importar un sistema suyo (MIT)
  classic-level: ^3.0.0
  i18next: ^26.5.11
  ioredis: ^6.0.0
  postgres: ^3.4.9
  react: ^19.3.1
  react-dom: ^19.3.1
  react-i18next: ^17.1.9
  turbo: ^2.11.10
  typescript: ^7.0.2
  vite: ^8.3.5
  vitest: ^5.0.5
  y-protocols: ^1.0.7
  yjs: ^13.6.33
  zod: ^4.6.7

minimumReleaseAgeExclude:
  - "@biomejs/biome@2.6.4"
  - "@biomejs/cli-android-arm64@2.6.4"
  - "@biomejs/cli-android-x64@2.6.4"
  - "@biomejs/cli-darwin-arm64@2.6.4"
  - "@biomejs/cli-darwin-x64@2.6.4"
  - "@biomejs/cli-linux-arm64-musl@2.6.4"
  - "@biomejs/cli-linux-arm64@2.6.4"
  - "@biomejs/cli-linux-x64-musl@2.6.4"
  - "@biomejs/cli-linux-x64@2.6.4"
  - "@biomejs/cli-win32-arm64@2.6.4"
  - "@biomejs/cli-win32-x64@2.6.4"
